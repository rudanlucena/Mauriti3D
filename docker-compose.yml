services:
  postgres:
    image: postgres:16-alpine
    container_name: mauriti3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mauriti3d
      POSTGRES_USER: mauriti3d
      POSTGRES_PASSWORD: mauriti3d123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
